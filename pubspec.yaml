name: tube_arena

description: Tube Arena - an Android-first YouTube-inspired media app with downloads, a local library and offline playback.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  provider: ^6.1.2
  go_router: ^18.1.4
  cached_network_image: ^4.0.7
  cupertino_icons: ^2.0.0
  video_player: ^2.14.1
  audio_service: ^0.18.19
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  ffmpeg_kit_flutter_new_full: ^3.0.0
  youtube_explode_dart: ^3.1.0
  logger: ^2.5.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  app_links: ^6.4.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
