name: tube_arena

description: Tube Arena - A modern YouTube-inspired cross-platform media app with download management, local library, and batch actions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  go_router: ^13.0.0
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.0
  intl: ^0.19.0
  video_player: ^2.16.1
  chewie: ^1.2.7
  just_audio: ^0.9.38
  audio_service: ^0.18.12
  path_provider: ^2.6.0
  permission_handler: ^11.0.0
  flutter_downloader: ^1.11.0
  ffmpeg_kit_flutter: ^5.1.0
  youtube_explode_dart: ^2.2.0
  share_plus: ^10.0.0
  file_picker: ^8.1.3
  logger: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
