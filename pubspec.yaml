name: tube_arena

description: Tube Arena - A modern YouTube-inspired cross-platform media app with download management, local library, and batch actions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  connectivity_plus: ^6.1.4
  go_router: ^13.0.0
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.0
  video_player: ^2.14.1
  just_audio: ^0.9.38
  share_plus: ^10.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  audio_service: ^0.18.12
  path_provider: ^2.1.5
  flutter_downloader: ^1.11.0
  ffmpeg_kit_flutter_new_full: ^2.5.7
  youtube_explode_dart: ^2.2.0
  youtube_player_iframe: ^6.0.2
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
