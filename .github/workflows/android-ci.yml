name: Tube Arena Android CI

on:
  push:
    branches:
      - main
      - "autofix/**"
      - "fix/high-priority-bugs"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tube-arena-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  flutter-checks:
    name: Flutter analyze, tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format and commit search changes
        run: |
          dart format --line-length 120 lib/app.dart lib/ui/screens/home_screen.dart lib/ui/screens/search_screen.dart test/search_screen_test.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app.dart lib/ui/screens/home_screen.dart lib/ui/screens/search_screen.dart test/search_screen_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "Format search screen changes"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Check formatting
        run: dart format --line-length 120 --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tube-arena-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Upload split release APKs
        uses: actions/upload-artifact@v7
        with:
          name: tube-arena-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke-test:
    name: Install and launch on Android emulator
    needs: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: tube-arena-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-metrics -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 2048 -cores 2
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh app-debug.apk

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshot
          path: emulator-screenshot.png
          if-no-files-found: ignore
