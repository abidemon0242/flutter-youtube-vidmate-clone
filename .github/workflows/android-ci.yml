name: Tube Arena Android CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tube-arena-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter analyze, tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project scaffolding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tube-arena-native"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/TubeArenaManifest.xml"
          flutter create --platforms=android --org com.tubearena --project-name app "$RUNNER_TEMP/tube-arena-native"
          rm -rf android
          cp -R "$RUNNER_TEMP/tube-arena-native/android" android
          cp "$RUNNER_TEMP/TubeArenaManifest.xml" android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace(' package="com.tubearena.app"', '')
          if 'android:name="io.flutter.embedding.android.NormalTheme"' not in text:
              text = text.replace(
                  '        <intent-filter>',
                  '        <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />\n        <intent-filter>',
                  1,
              )
          if 'android:name="flutterEmbedding"' not in text:
              text = text.replace(
                  '    </application>',
                  '        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>',
                  1,
              )
          manifest.write_text(text)
          PY

      - name: Configure Android SDK levels for plugin compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          paths = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          min_replacements = [
              ("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24"),
              ("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 24"),
              ("minSdk = flutter.minSdkVersion", "minSdk = 24"),
          ]
          min_updated = False
          compile_updated = False
          for path in paths:
              if not path.exists():
                  continue
              content = path.read_text()
              original = content
              for old, new in min_replacements:
                  content = content.replace(old, new)
              if content != original:
                  min_updated = True
              content, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?$)",
                  r"\g<1>36\g<2>",
                  content,
              )
              if count:
                  compile_updated = True
              if content != original:
                  path.write_text(content)
          if not min_updated:
              raise SystemExit("Could not set Android minSdk to 24 in generated Gradle configuration.")
          if not compile_updated:
              raise SystemExit("Could not set Android compileSdk to 36 in generated Gradle configuration.")
          PY

      - name: Ensure declared asset directories exist
        run: mkdir -p assets/images assets/icons

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tube-arena-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build optimized split release APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Upload split release APKs
        uses: actions/upload-artifact@v4
        with:
          name: tube-arena-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke-test:
    name: Install and launch on Android emulator
    needs: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project scaffolding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tube-arena-native"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/TubeArenaManifest.xml"
          flutter create --platforms=android --org com.tubearena --project-name app "$RUNNER_TEMP/tube-arena-native"
          rm -rf android
          cp -R "$RUNNER_TEMP/tube-arena-native/android" android
          cp "$RUNNER_TEMP/TubeArenaManifest.xml" android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace(' package="com.tubearena.app"', '')
          if 'android:name="io.flutter.embedding.android.NormalTheme"' not in text:
              text = text.replace(
                  '        <intent-filter>',
                  '        <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />\n        <intent-filter>',
                  1,
              )
          if 'android:name="flutterEmbedding"' not in text:
              text = text.replace(
                  '    </application>',
                  '        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>',
                  1,
              )
          manifest.write_text(text)
          PY

      - name: Configure Android SDK levels for plugin compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          paths = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          min_replacements = [
              ("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24"),
              ("minSdkVersion = flutter.minSdkVersion", "minSdkVersion = 24"),
              ("minSdk = flutter.minSdkVersion", "minSdk = 24"),
          ]
          min_updated = False
          compile_updated = False
          for path in paths:
              if not path.exists():
                  continue
              content = path.read_text()
              original = content
              for old, new in min_replacements:
                  content = content.replace(old, new)
              if content != original:
                  min_updated = True
              content, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)(\s*(?://.*)?$)",
                  r"\g<1>36\g<2>",
                  content,
              )
              if count:
                  compile_updated = True
              if content != original:
                  path.write_text(content)
          if not min_updated:
              raise SystemExit("Could not set Android minSdk to 24 in generated Gradle configuration.")
          if not compile_updated:
              raise SystemExit("Could not set Android compileSdk to 36 in generated Gradle configuration.")
          PY

      - name: Ensure declared asset directories exist
        run: mkdir -p assets/images assets/icons

      - name: Build debug APK for emulator
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Boot emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 2048 -cores 2
          emulator-boot-timeout: 1200
          # The runner's animation toggle invokes adb settings calls that
          # intermittently fail with a broken pipe on this hosted emulator.
          disable-animations: false
          script: |
            set -eu
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am start -n com.tubearena.app/.MainActivity
            sleep 15
            app_pid="$(adb shell pidof com.tubearena.app || true)"
            test -n "$app_pid"
            if adb logcat -d -t 1500 | grep -E "FATAL EXCEPTION|AndroidRuntime"; then
              echo "Android runtime crash detected."
              exit 1
            fi
