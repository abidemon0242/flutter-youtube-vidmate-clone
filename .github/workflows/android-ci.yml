name: Tube Arena Android CI

on:
  push:
    branches:
      - main
      - "autofix/**"
      - "fix/high-priority-bugs"
  pull_request:
  workflow_dispatch:

concurrency:
  group: tube-arena-android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  flutter-checks:
    name: Flutter analyze, tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Keep this check aligned with the repository's 120-character Dart formatter setting.
      - name: Check formatting
        run: dart format --line-length 120 --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Set up persistent debug keystore
        run: |
          # Decode the persistent debug keystore from GitHub Actions secret.
          # This ensures the same signing key is used across all CI runs,
          # providing a stable SHA-1/SHA-256 fingerprint for Firebase.
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret is not configured."
            echo "See docs/GOOGLE_SIGN_IN_SETUP.md for one-time setup instructions."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
          echo "Persistent debug keystore configured."
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Read Web OAuth client ID for native Google Sign-In
        id: oauth
        run: |
          WEB_CLIENT_ID=$(jq -r '.client[]?.services?.appinvite_service?.other_platform_oauth_client[]? | select(.client_type == 3) | .client_id // empty' android/app/google-services.json | head -n1)
          if [ -z "$WEB_CLIENT_ID" ]; then
            echo "::error::Web OAuth client ID is missing; refusing to build an APK with incomplete Google Sign-In configuration."
            exit 1
          fi
          echo "web_client_id=$WEB_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug --no-pub --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ steps.oauth.outputs.web_client_id }}

      - name: Report and verify debug APK signing fingerprints
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo 'Register these Android app signing fingerprints in Firebase Project Settings:'
          CERT_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          echo "$CERT_OUTPUT" | grep -E 'certificate SHA-1 digest:|certificate SHA-256 digest:'
          SHA1=$(echo "$CERT_OUTPUT" | grep -oE 'SHA-1 digest: [0-9a-fA-F:]+' | head -n1 | awk '{print $3}' | tr -d ':' | tr 'A-F' 'a-f')
          SHA256=$(echo "$CERT_OUTPUT" | grep -oE 'SHA-256 digest: [0-9a-fA-F:]+' | head -n1 | awk '{print $3}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Normalized APK SHA-1: $SHA1"
          echo "Normalized APK SHA-256: $SHA256"
          if ! jq -e --arg sha "$SHA1" '[.client[]?.oauth_client[]? | select(.client_type == 1) | .android_info.certificate_hash? | ascii_downcase] | index($sha | ascii_downcase) != null' android/app/google-services.json >/dev/null; then
            echo "::error::APK SHA-1 $SHA1 is not present in an Android OAuth client in google-services.json."
            echo "Register the APK SHA-1 in Firebase Project Settings -> Your apps -> Android,"
            echo "then download a fresh google-services.json and commit it."
            exit 1
          fi
          # Firebase stores the Web OAuth client under services.appinvite_service,
          # not beside Android OAuth clients in oauth_client.
          WEB_CLIENT_ID=$(jq -r '.client[]?.services?.appinvite_service?.other_platform_oauth_client[]? | select(.client_type == 3) | .client_id // empty' android/app/google-services.json | head -n1)
          if [ -z "$WEB_CLIENT_ID" ] || ! printf "%s" "$WEB_CLIENT_ID" | grep -Eq "^[0-9]+-[A-Za-z0-9_-]+[.]apps[.]googleusercontent[.]com$"; then
            echo "::error::A valid Web OAuth client (client_type 3) is missing from services.appinvite_service.other_platform_oauth_client in google-services.json."
            exit 1
          fi
          echo "APK SHA-1 and Web OAuth client are present in google-services.json."
          echo "Web OAuth client ID is configured (value intentionally not printed)."
          echo "APK SHA-256: $SHA256"
          echo "Register SHA-256 separately in Firebase App settings; it is not an Android OAuth certificate_hash in this JSON."

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tube-arena-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Release APKs are intentionally not built in CI until a private release
      # keystore is configured in repository Actions secrets. Never use the
      # debug signing key for a distributable release.

  firebase-auth-android-sdk-test:
    name: FlutterFire Auth SDK integration on Android emulator
    needs: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Read Web OAuth client ID
        run: |
          WEB_CLIENT_ID=$(jq -r '.client[]?.services?.appinvite_service?.other_platform_oauth_client[]? | select(.client_type == 3) | .client_id // empty' android/app/google-services.json | head -n1)
          if [ -z "$WEB_CLIENT_ID" ]; then
            echo "::error::Web OAuth client ID is missing from google-services.json."
            exit 1
          fi
          echo "GOOGLE_SERVER_CLIENT_ID=$WEB_CLIENT_ID" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Start isolated Firebase Auth Emulator
        run: |
          firebase emulators:start --only auth --project demo-tube-arena > /tmp/firebase-auth-emulator.log 2>&1 &
          echo $! > /tmp/firebase-auth-emulator.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9099/ >/dev/null; then
              echo "Firebase Auth Emulator is accepting connections."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/firebase-auth-emulator.log
          echo "::error::Firebase Auth Emulator did not start in time."
          exit 1

      - name: Run FlutterFire SDK authentication tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-metrics -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 2048 -cores 2
          emulator-boot-timeout: 1200
          disable-animations: true
          script: |
            flutter test integration_test/auth_emulator_test.dart -d emulator-5554 \
              --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
              --reporter expanded

      - name: Show Auth Emulator logs on failure
        if: failure()
        run: cat /tmp/firebase-auth-emulator.log

  android-emulator-smoke-test:
    name: Install and launch on Android emulator
    needs: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: tube-arena-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-metrics -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 2048 -cores 2
          emulator-boot-timeout: 1200
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh app-debug.apk

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-screenshot
          path: emulator-screenshot.png
          if-no-files-found: ignore

  firebase-auth-emulator-test:
    name: Firebase Auth Emulator passwordless integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Start isolated Firebase Auth Emulator
        run: |
          firebase emulators:start --only auth --project demo-tube-arena > /tmp/firebase-auth-emulator.log 2>&1 &
          echo $! > /tmp/firebase-auth-emulator.pid
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9099/ >/dev/null; then
              echo "Firebase Auth Emulator is accepting connections."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/firebase-auth-emulator.log
          echo "::error::Firebase Auth Emulator did not start in time."
          exit 1

      - name: Test passwordless email link and session lifecycle
        run: bash .github/scripts/auth-emulator-smoke.sh

      - name: Show emulator logs on failure
        if: failure()
        run: cat /tmp/firebase-auth-emulator.log
