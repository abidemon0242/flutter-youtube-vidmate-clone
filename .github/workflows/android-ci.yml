name: Tube Arena Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# PR updates run once through pull_request; main pushes run through push.
# A PR number keeps all updates to that PR in one concurrency group.
concurrency:
  group: tube-arena-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-checks:
    name: Flutter analyze, tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project scaffolding
        run: bash tool/bootstrap_android.sh

      - name: Ensure declared asset directories exist
        run: mkdir -p assets/images assets/icons

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tube-arena-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build optimized split release APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Upload split release APKs
        uses: actions/upload-artifact@v4
        with:
          name: tube-arena-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke-test:
    name: Install and launch on Android emulator
    needs: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project scaffolding
        run: bash tool/bootstrap_android.sh

      - name: Ensure declared asset directories exist
        run: mkdir -p assets/images assets/icons

      - name: Build debug APK for emulator
        run: |
          flutter pub get
          flutter build apk --debug
          (cd android && ./gradlew --stop)

      - name: Prepare emulator smoke-test script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tube-arena-smoke.sh" <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail

          wait_for_package_manager() {
            for attempt in $(seq 1 60); do
              if adb shell service check package 2>/dev/null | grep -q "found"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          adb wait-for-device
          if ! wait_for_package_manager; then
            echo "Package Manager did not become ready; rebooting emulator once."
            adb reboot
            adb wait-for-device
            wait_for_package_manager
          fi

          installed=false
          for attempt in 1 2 3; do
            if adb install -r build/app/outputs/flutter-apk/app-debug.apk; then
              installed=true
              break
            fi
            echo "APK installation attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              adb reboot
              adb wait-for-device
              wait_for_package_manager
            fi
          done
          test "$installed" = true

          adb logcat -c
          adb shell am start -n com.tubearena.app/.MainActivity
          sleep 15
          app_pid="$(adb shell pidof com.tubearena.app || true)"
          test -n "$app_pid"
          if adb logcat -d -t 1500 | grep -E "FATAL EXCEPTION|AndroidRuntime"; then
            echo "Android runtime crash detected."
            exit 1
          fi
          SMOKE
          chmod +x "$RUNNER_TEMP/tube-arena-smoke.sh"

      - name: Boot emulator, install and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 2048 -cores 2
          emulator-boot-timeout: 1200
          disable-animations: false
          script: bash "$RUNNER_TEMP/tube-arena-smoke.sh"
