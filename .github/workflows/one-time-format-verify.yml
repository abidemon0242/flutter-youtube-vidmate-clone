name: One-time format and verification

on:
  push:
    branches:
      - fix/high-priority-bugs

permissions:
  contents: write

jobs:
  format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-priority-bugs
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format --line-length 120 lib test
      - name: Commit formatting corrections
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: apply Dart formatter"
            git push origin HEAD:fix/high-priority-bugs
          fi
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Build debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tube-arena-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
