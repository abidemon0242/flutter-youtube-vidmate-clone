name: Tube Arena branch verification

on:
  push:
    branches:
      - fix/high-priority-bugs

permissions:
  contents: write

concurrency:
  group: tube-arena-branch-verification
  cancel-in-progress: true

jobs:
  format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-priority-bugs
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: stable
          flutter-version: '3.50.1'
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format --line-length 120 lib test integration_test
      - name: Commit generated dependency lock and formatting corrections
        run: |
          git add lib test integration_test pubspec.yaml pubspec.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync dependencies and Dart formatting"
            git push origin HEAD:fix/high-priority-bugs
          fi
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      # APKs are built and published only by android-ci.yml, which validates
      # Firebase OAuth configuration and verifies the persistent signing key.
